# On every push to main, mirrors work-rest-cycles/ to public_html/work-rest-cycles/
# via FTPS (explicit TLS). Bypasses cPanel Git Version Control entirely.
#
# Repository secrets required:
#   CPANEL_HOST      FTP hostname (same as your cPanel host, e.g. server123.greengeeks.net)
#   CPANEL_USERNAME  cPanel / FTP username
#   FTP_PASSWORD     cPanel account password (or an FTP sub-account password)
name: Deploy to GreenGeeks via FTPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Mirror site to server via FTPS
        env:
          FTP_HOST: ${{ secrets.CPANEL_HOST }}
          FTP_USER: ${{ secrets.CPANEL_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
            set ftp:ssl-force true
            set ftp:ssl-protect-data true
            set ssl:verify-certificate false
            open -u '$FTP_USER','$FTP_PASS' '$FTP_HOST'
            mirror --reverse --delete --verbose \
              work-rest-cycles/ \
              public_html/work-rest-cycles/
          "
