# On every push to main, rsyncs work-rest-cycles/ → public_html/work-rest-cycles/
# over SSH using key-based auth.
#
# Repository secrets required:
#   CPANEL_HOST       SSH hostname (e.g. server123.greengeeks.net)
#   CPANEL_USERNAME   cPanel / SSH username
#   SSH_PRIVATE_KEY   Ed25519 private key (public key authorized in cPanel SSH Key Manager)
name: Deploy to GreenGeeks via SSH

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 2222 "${{ secrets.CPANEL_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh-keyscan "${{ secrets.CPANEL_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Test SSH connection (port 2222)
        env:
          SSH_HOST: ${{ secrets.CPANEL_HOST }}
          SSH_USER: ${{ secrets.CPANEL_USERNAME }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p 2222 -v \
            "$SSH_USER@$SSH_HOST" echo "SSH OK port 2222" 2>&1 || true

      - name: Test SSH connection (port 22)
        env:
          SSH_HOST: ${{ secrets.CPANEL_HOST }}
          SSH_USER: ${{ secrets.CPANEL_USERNAME }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p 22 -v \
            "$SSH_USER@$SSH_HOST" echo "SSH OK port 22" 2>&1 || true

      - name: Deploy via rsync over SSH
        env:
          SSH_HOST: ${{ secrets.CPANEL_HOST }}
          SSH_USER: ${{ secrets.CPANEL_USERNAME }}
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p 22" \
            work-rest-cycles/ \
            "$SSH_USER@$SSH_HOST:public_html/work-rest-cycles/"
