# On every push to main, tells cPanel (workerpowerforhealth.com server on GreenGeeks)
# to pull this repo and run .cpanel.yml, which copies the site into
# public_html/work-rest-cycles.
#
# Repository secrets required:
#   CPANEL_HOST       server hostname, without https:// or :2083
#   CPANEL_USERNAME   cPanel username
#   CPANEL_API_TOKEN  cPanel API token (Security > Manage API Tokens)
name: Deploy to GreenGeeks cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REPO_ROOT: /home/${{ secrets.CPANEL_USERNAME }}/repositories/work-rest-cycles
      API: https://${{ secrets.CPANEL_HOST }}:2083/execute
      AUTH: "cpanel ${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_API_TOKEN }}"
    steps:
      - name: Pull latest commit into cPanel repository
        run: |
          resp=$(curl -sS -G -H "Authorization: $AUTH" \
            --data-urlencode "repository_root=$REPO_ROOT" \
            --data-urlencode "branch=main" \
            "$API/VersionControl/update")
          echo "$resp" | jq '{status, errors, messages}'
          [ "$(echo "$resp" | jq -r '.status')" = "1" ]

      - name: Deploy HEAD commit
        run: |
          resp=$(curl -sS -G -H "Authorization: $AUTH" \
            --data-urlencode "repository_root=$REPO_ROOT" \
            "$API/VersionControlDeployment/create")
          echo "$resp" | jq '{status, errors, messages}'
          [ "$(echo "$resp" | jq -r '.status')" = "1" ]
