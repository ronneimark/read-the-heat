# On every push to main, rsyncs work-rest-cycles/ → public_html/work-rest-cycles/
# over SSH. No cPanel Git involved.
#
# Repository secrets required:
#   CPANEL_HOST      SSH hostname (same as cPanel host, e.g. server123.greengeeks.net)
#   CPANEL_USERNAME  cPanel / SSH username
#   FTP_PASSWORD     cPanel account password (used here as the SSH password)
name: Deploy to GreenGeeks via SSH

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Deploy via rsync over SSH
        env:
          SSH_HOST: ${{ secrets.CPANEL_HOST }}
          SSH_USER: ${{ secrets.CPANEL_USERNAME }}
          SSH_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          sshpass -p "$SSH_PASS" rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=no -p 22" \
            work-rest-cycles/ \
            "$SSH_USER@$SSH_HOST:public_html/work-rest-cycles/"
