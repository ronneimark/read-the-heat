<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acclimatization Status — Work-Rest Cycles</title>
<link rel="stylesheet" href="shared.css">
<script src="./lang-link.js"></script>
</head>
<body>

<div id="fixed-top">
  <div class="hazard-bar"></div>
  <header>
    <a class="home-btn" href="index.html" title="Home" aria-label="Home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2 2.5 11.1a.9.9 0 0 0 1.15 1.38L5 11.35V20a1 1 0 0 0 1 1h4.5v-6h3v6H18a1 1 0 0 0 1-1v-8.65l1.35 1.13a.9.9 0 0 0 1.15-1.38Z"/></svg></a>
    <div class="header-inner">
      <img class="header-brand" src="images/read-the-heat-logo-transparent.png" alt="Read the Heat &amp; Take a Beat — for indoor occupations">
      <div class="header-attribution">
        <a class="wrc-sph-pill" href="https://glcohs.uic.edu" target="_blank" rel="noopener" aria-label="UIC Great Lakes Center for Occupational Health and Safety"><img src="images/uic-public-health-logo.png" alt="UIC Public Health"></a>
        <span class="header-attribution-text">An outreach project of the Great Lakes Center for Occupational Health and Safety</span>
      </div>
    </div>
  </header>
  <div class="wrc-banner-strip">
    <div class="wrc-banner-strip-inner">
      <div class="wrc-breadcrumbs" id="wrc-breadcrumbs"></div>
      <button class="strip-btn" onclick="openMethodologyModal()">📚 Methodology</button>
      <!-- language selector injected here by lang-switch.js -->
    </div>
  </div>
</div><!-- /fixed-top -->

<div id="launcher">
  <div class="launcher-screen active" id="ls3">

    <div class="ls2-topbar">
      <div class="ls2-sector-banner">
        <strong id="ls3-activity-summary">Moderate Work</strong>
        <span id="ls3-activity-kcal-hint">~200–350 kcal/hr</span>
      </div>
    </div>

    <div class="ls3-acclim-wrap">
      <div class="launcher-step">
        <div class="launcher-step-label">Has this worker completed heat acclimatization?</div>
      </div>

      <div class="ls3-acclim-cards">

        <button class="ls3-acclim-card ls3-acclim-yes" onclick="commitWorkerStatus('acclimatized')">
          <span class="ls3-acclim-icon">&#x2705;</span>
          <div class="ls3-acclim-title">Acclimatized</div>
          <div class="ls3-acclim-desc">Has completed heat acclimatization and has not been absent from heat work for a week or more. Work-rest cycles use the <strong>NIOSH Recommended Exposure Limits (REL)</strong>.</div>
          <ul class="ls3-acclim-bullets">
            <li>Experienced worker in continuous heat exposure</li>
            <li>Returning worker absent fewer than 7 days</li>
            <li><em>New workers:</em> 7–14 day graduated ramp — ≤20% of usual heat exposure on Day 1, +20% per day</li>
            <li><em>Workers with prior experience:</em> 4-day return ramp (50% → 60% → 80% → 100%)</li>
            <li>NIOSH (2016): acclimatization increases sweating efficiency, stabilizes circulation, and lowers core temperature and heart rate at the same workload</li>
          </ul>
          <span class="ls3-acclim-cta">Select Acclimatized <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M5 3l4 4-4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        </button>

        <button class="ls3-acclim-card ls3-acclim-no" onclick="commitWorkerStatus('unacclimatized')">
          <span class="ls3-acclim-icon">&#x26A0;&#xFE0F;</span>
          <div class="ls3-acclim-title">Unacclimatized</div>
          <div class="ls3-acclim-desc">New to heat work, or returning after a week or more away. Uses the more protective <strong>NIOSH Recommended Alert Limits (RAL)</strong> — approximately 2–3&deg;C (3–5&deg;F) more restrictive than the REL.</div>
          <ul class="ls3-acclim-bullets">
            <li>New employees who have not yet completed the acclimatization ramp</li>
            <li>Workers returning after 7+ days away from heat exposure</li>
            <li>Workers newly assigned to hot areas</li>
            <li>Workers with cardiovascular disease, obesity, certain medications, or prior heat illness</li>
            <li>Per NIOSH (2016): <em>"lack of acclimatization has been shown to be a major factor associated with worker heat-related illness and death"</em></li>
          </ul>
          <span class="ls3-acclim-cta">Select Unacclimatized <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M5 3l4 4-4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        </button>

      </div>
    </div>

  </div><!-- /ls3 -->
</div><!-- /launcher -->

<script src="shared.js"></script>
<script src="./lang-switch.js"></script>
<script>
  function commitWorkerStatus(status) {
    navigate('measurement.html', { workerStatus: status });
  }

  function updateLayout() {
    const fixedTop = document.getElementById('fixed-top');
    const ls3 = document.getElementById('ls3');
    const fixedH = fixedTop.offsetHeight;
    const vh = window.innerHeight;
    ls3.style.paddingTop = (fixedH + 10) + 'px';
    ls3.style.height = vh + 'px';
  }

  document.addEventListener('DOMContentLoaded', () => {
    const s = WRC.get();
    const label = s.activityLabel || 'Moderate Work';
    const kcal  = s.activityKcal  || '~200–350 kcal/hr';
    const summEl = document.getElementById('ls3-activity-summary');
    const kcalEl = document.getElementById('ls3-activity-kcal-hint');
    if (summEl) summEl.textContent = label;
    if (kcalEl) kcalEl.textContent = kcal;
    buildBreadcrumbs();
    updateLayout();
    window.addEventListener('resize', updateLayout);
  });
</script>
</body>
</html>
