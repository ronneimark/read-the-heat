<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Indoor Heat Stress: Work-Rest Cycles</title>
<link rel="stylesheet" href="shared.css">
<script src="./lang-link.js"></script>
</head>
<body>

<div id="fixed-top">
  <div class="hazard-bar"></div>
  <header>
    <div class="header-logo-wrap">
      <picture><source media="(max-width: 600px)" srcset="images/logo-mobile.png"><img class="header-logo-img" src="images/logo-desktop.png" alt="Read the Heat and Take a Beat"></picture>
    </div>
  </header>
  <div class="wrc-banner-strip">
    <div class="wrc-banner-strip-inner">
      <button class="strip-btn" style="position:absolute;left:50%;transform:translateX(-50%)" onclick="window.location.href='methodology.html'">📚 Methodology</button>
      <!-- language selector injected here by lang-switch.js -->
    </div>
  </div>
</div><!-- /fixed-top -->

<div id="launcher">
  <div class="launcher-screen active" id="ls1">
    <div class="ls1-header" style="display:flex;align-items:center;gap:16px">
      <p class="ls-heading" style="margin:0;white-space:nowrap">What industry is this work in?</p>
      <p class="ls-sub" style="margin:0;font-size:14px">Pick the sector — you'll review sample activities to confirm the exertion level before looking up work-rest cycles.</p>
    </div>

    <div class="ls1-sector-grid" id="ls1-sector-grid">
      <button class="ls1-sector-btn" data-sector="restaurant" onclick="ls1SelectSector('restaurant')"><img class="ls1-photo" src="images/industries/restaurant.jpg" alt="" loading="lazy"><span class="ls1-sector-label">Restaurant / Kitchen</span></button>
      <button class="ls1-sector-btn" data-sector="warehouse" onclick="ls1SelectSector('warehouse')"><img class="ls1-photo" src="images/industries/warehouse.jpg" alt="" loading="lazy"><span class="ls1-sector-label">Warehouse / Distribution</span></button>
      <button class="ls1-sector-btn" data-sector="factory" onclick="ls1SelectSector('factory')"><img class="ls1-photo" src="images/industries/factory.jpg" alt="" loading="lazy"><span class="ls1-sector-label">Factory / Manufacturing</span></button>
      <button class="ls1-sector-btn" data-sector="healthcare" onclick="ls1SelectSector('healthcare')"><img class="ls1-photo" src="images/industries/healthcare.jpg" alt="" loading="lazy"><span class="ls1-sector-label">Healthcare</span></button>
      <button class="ls1-sector-btn" data-sector="retail" onclick="ls1SelectSector('retail')"><img class="ls1-photo" src="images/industries/retail.jpg" alt="" loading="lazy"><span class="ls1-sector-label">Retail</span></button>
      <button class="ls1-sector-btn" data-sector="construction" onclick="ls1SelectSector('construction')"><img class="ls1-photo" src="images/industries/construction.jpg" alt="" loading="lazy"><span class="ls1-sector-label">Indoor Construction</span></button>
      <button class="ls1-sector-btn" data-sector="laundry" onclick="ls1SelectSector('laundry')"><img class="ls1-photo" src="images/industries/laundry.jpg" alt="" loading="lazy"><span class="ls1-sector-label">Laundry / Linen Services</span></button>
      <button class="ls1-sector-btn" data-sector="foodprocessing" onclick="ls1SelectSector('foodprocessing')"><img class="ls1-photo" src="images/industries/foodprocessing.jpg" alt="" loading="lazy"><span class="ls1-sector-label">Food Processing</span></button>
      <button class="ls1-sector-btn" data-sector="publicsafety" onclick="ls1SelectSector('publicsafety')"><img class="ls1-photo" src="images/industries/publicsafety.jpg" alt="" loading="lazy"><span class="ls1-sector-label">Public Safety / Emergency</span></button>
      <button class="ls1-sector-btn" data-sector="buildingservices" onclick="ls1SelectSector('buildingservices')"><img class="ls1-photo" src="images/industries/buildingservices.jpg" alt="" loading="lazy"><span class="ls1-sector-label">Janitorial / Housekeeping</span></button>
      <button class="ls1-sector-btn" data-sector="agriculture" onclick="ls1SelectSector('agriculture')"><img class="ls1-photo" src="images/industries/agriculture.jpg" alt="" loading="lazy"><span class="ls1-sector-label">Agriculture / Greenhouse</span></button>
      <button class="ls1-sector-btn" data-sector="garment" onclick="ls1SelectSector('garment')"><img class="ls1-photo" src="images/industries/garment.jpg" alt="" loading="lazy"><span class="ls1-sector-label">Garment / Textile</span></button>
      <button class="ls1-sector-btn" data-sector="hospitality" onclick="ls1SelectSector('hospitality')"><img class="ls1-photo" src="images/industries/hospitality.jpg" alt="" loading="lazy"><span class="ls1-sector-label">Hospitality / Hotel</span></button>
      <button class="ls1-sector-btn" data-sector="childcare" onclick="ls1SelectSector('childcare')"><img class="ls1-photo" src="images/industries/childcare.jpg" alt="" loading="lazy"><span class="ls1-sector-label">Childcare</span></button>
    </div>

    <div class="ls1-footer"></div>
  </div><!-- /ls1 -->
</div><!-- /launcher -->

<script src="shared.js"></script>
<script src="./lang-switch.js"></script>
<script>
  function ls1SelectSector(key) {
    document.querySelectorAll('.ls1-sector-btn').forEach(b =>
      b.classList.toggle('selected', b.dataset.sector === key));
    setTimeout(() => navigate('activity.html', { sector: key }), 220);
  }

  function updateLayout() {
    const fixedTop = document.getElementById('fixed-top');
    const ls1 = document.getElementById('ls1');
    const fixedH = fixedTop.offsetHeight;
    const vh = window.innerHeight;
    ls1.style.paddingTop = (fixedH + 16) + 'px';
    ls1.style.height = vh + 'px';
  }

  document.addEventListener('DOMContentLoaded', () => {
    // Restore previously selected sector if any
    const prev = WRC.val('sector', null);
    if (prev) {
      document.querySelectorAll('.ls1-sector-btn').forEach(b =>
        b.classList.toggle('selected', b.dataset.sector === prev));
    }
    updateLayout();
    window.addEventListener('resize', updateLayout);
  });
</script>
</body>
</html>
