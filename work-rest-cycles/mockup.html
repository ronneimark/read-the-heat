<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Read the Heat — Device Mockups</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0f1117;
    --surface:   #1a1f2e;
    --panel:     #222840;
    --border:    #2e3650;
    --accent:    #D50032;
    --navy:      #001E62;
    --text:      #e8eaf0;
    --muted:     #7a839e;
    --label:     #a0a8c0;
    --active-bg: #1e2a4a;
    --active-bd: #4a6fc0;
    font-family: 'Inter', system-ui, sans-serif;
  }

  html, body { height: 100%; background: var(--bg); color: var(--text); overflow: hidden; }

  /* ── OUTER LAYOUT ── */
  .workspace {
    display: grid;
    grid-template-columns: 220px 1fr;
    grid-template-rows: 48px 1fr;
    height: 100%;
  }

  /* ── TOP BAR ── */
  .topbar {
    grid-column: 1 / -1;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 16px;
  }
  .topbar-mark { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
  .topbar-title { font-size: 13px; font-weight: 600; color: var(--text); letter-spacing: 0.01em; }
  .topbar-sub { font-size: 11px; color: var(--muted); }
  .topbar-spacer { flex: 1; }

  /* Device mode buttons */
  .device-modes {
    display: flex;
    align-items: center;
    gap: 3px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 3px;
  }
  .mode-btn {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 4px 10px;
    border: none;
    border-radius: 5px;
    background: transparent;
    color: var(--muted);
    font-size: 11px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.12s, color 0.12s;
  }
  .mode-btn:hover { background: var(--active-bg); color: var(--text); }
  .mode-btn.active { background: var(--active-bg); color: #fff; box-shadow: inset 0 0 0 1px var(--active-bd); }
  .mode-icon { font-size: 13px; line-height: 1; }

  .topbar-badge {
    font-size: 10px; font-weight: 600; color: var(--muted);
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 4px; padding: 2px 7px;
    letter-spacing: 0.04em; text-transform: uppercase;
  }

  /* ── SIDEBAR ── */
  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    overflow-y: auto;
    padding: 12px 0 20px;
  }
  .sidebar-section-label {
    font-size: 9px; font-weight: 700; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--muted);
    padding: 12px 16px 6px;
  }
  .sidebar-section-label:first-child { padding-top: 4px; }
  .nav-btn {
    display: flex; align-items: center; gap: 10px;
    width: 100%; padding: 9px 16px;
    background: none; border: none; border-left: 2px solid transparent;
    cursor: pointer; text-align: left; color: var(--label);
    font-size: 12.5px; font-family: inherit; font-weight: 500;
    transition: background 0.12s, color 0.12s, border-color 0.12s;
    line-height: 1.3;
  }
  .nav-btn:hover { background: var(--panel); color: var(--text); }
  .nav-btn.active { background: var(--active-bg); border-left-color: var(--active-bd); color: #fff; }
  .nav-icon {
    width: 28px; height: 28px; border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; flex-shrink: 0; background: var(--panel);
  }
  .nav-btn.active .nav-icon { background: rgba(74,111,192,0.25); }
  .nav-text { flex: 1; min-width: 0; }
  .nav-name { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nav-desc {
    display: block; font-size: 10px; color: var(--muted); font-weight: 400;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px;
  }
  .nav-btn.active .nav-desc { color: #a0b8e0; }
  .sidebar-divider { height: 1px; background: var(--border); margin: 8px 16px; }
  .reload-btn {
    display: flex; align-items: center; gap: 8px;
    margin: 8px 12px 0; padding: 7px 12px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 7px; color: var(--muted); font-size: 11.5px;
    font-family: inherit; font-weight: 500; cursor: pointer;
    transition: background 0.12s, color 0.12s;
  }
  .reload-btn:hover { background: var(--active-bg); color: var(--text); }
  .reload-btn svg { flex-shrink: 0; }
  .sidebar-note {
    margin: 12px 14px 0; padding: 8px 10px;
    background: rgba(213,0,50,0.08); border: 1px solid rgba(213,0,50,0.2);
    border-radius: 6px; font-size: 10.5px; color: #f08090; line-height: 1.5;
  }

  /* ── STAGE ── */
  .stage {
    display: flex; align-items: center; justify-content: center;
    gap: 32px;
    background: var(--bg); overflow: auto;
    position: relative; padding: 32px;
  }
  .stage::before {
    content: ''; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 24px 24px; pointer-events: none;
  }

  /* ── DEVICE WRAPPER (positions, clips, holds scaled space) ── */
  .device-wrap {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    flex-shrink: 0;
  }
  .device-wrap[hidden] { display: none; }

  /* Scale container: sets the layout footprint, clips the scaled frame */
  .device-scale-clip {
    position: relative;
    overflow: visible; /* children use transform, clip handled by parent size */
    flex-shrink: 0;
  }

  /* ── SHARED FRAME SHELL ── */
  .device-frame {
    position: absolute; top: 0; left: 0;
    transform-origin: top left;
    filter: drop-shadow(0 24px 60px rgba(0,0,0,0.65));
  }

  /* ── PHONE FRAME (390×780 screen) ── */
  .phone-frame {
    width: 426px;   /* 390 + 18×2 side bezels */
    height: 860px;  /* 780 + 48 top + 32 bottom */
    background: #1c1c1e;
    border-radius: 52px;
    border: 1px solid #3a3a3c;
    box-shadow: inset 0 0 0 1px #555, inset 0 1px 0 #666, 0 0 0 1px #0a0a0a;
    position: absolute; top: 0; left: 0;
    display: flex; flex-direction: column;
    align-items: center;
    padding: 48px 18px 32px;
  }
  /* side buttons */
  .phone-frame::before {
    content: ''; position: absolute; left: -3px; top: 100px;
    width: 3px; height: 36px; background: #2c2c2e;
    border-radius: 2px 0 0 2px;
    box-shadow: 0 44px 0 #2c2c2e, 0 88px 0 #2c2c2e;
  }
  .phone-frame::after {
    content: ''; position: absolute; right: -3px; top: 140px;
    width: 3px; height: 64px; background: #2c2c2e;
    border-radius: 0 2px 2px 0;
  }
  .dynamic-island {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    width: 120px; height: 34px; background: #000; border-radius: 20px; z-index: 10;
  }
  .phone-screen {
    width: 390px; height: 780px;
    background: #F6F3EC; border-radius: 36px; overflow: hidden;
    position: relative; flex-shrink: 0;
  }
  .phone-home-indicator {
    position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
    width: 120px; height: 5px; background: rgba(255,255,255,0.3); border-radius: 3px;
  }

  /* ── IPAD PORTRAIT FRAME (768×1024 screen) ── */
  .ipad-v-frame {
    width: 800px;   /* 768 + 16×2 */
    height: 1114px; /* 1024 + 50 top + 40 bottom */
    background: #1c1c1e;
    border-radius: 28px;
    border: 1px solid #3a3a3c;
    box-shadow: inset 0 0 0 1px #555, inset 0 1px 0 #666, 0 0 0 1px #0a0a0a;
    position: absolute; top: 0; left: 0;
    display: flex; flex-direction: column; align-items: center;
    padding: 50px 16px 40px;
  }
  /* power button */
  .ipad-v-frame::before {
    content: ''; position: absolute; right: -3px; top: 120px;
    width: 3px; height: 44px; background: #2c2c2e;
    border-radius: 0 2px 2px 0;
  }
  /* volume buttons */
  .ipad-v-frame::after {
    content: ''; position: absolute; left: -3px; top: 160px;
    width: 3px; height: 36px; background: #2c2c2e;
    border-radius: 2px 0 0 2px;
    box-shadow: 0 50px 0 #2c2c2e;
  }
  .ipad-v-camera {
    position: absolute; top: 23px; left: 50%; transform: translateX(-50%);
    width: 10px; height: 10px; background: #2a2a2c; border-radius: 50%;
    border: 1px solid #444; z-index: 10;
  }
  .ipad-v-screen {
    width: 768px; height: 1024px;
    background: #F6F3EC; border-radius: 8px; overflow: hidden;
    position: relative; flex-shrink: 0;
  }
  .ipad-home-indicator {
    position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
    width: 140px; height: 4px; background: rgba(255,255,255,0.25); border-radius: 2px;
  }

  /* ── IPAD LANDSCAPE FRAME (1024×768 screen) ── */
  .ipad-h-frame {
    width: 1114px;  /* 1024 + 50 left + 40 right */
    height: 800px;  /* 768 + 16×2 */
    background: #1c1c1e;
    border-radius: 28px;
    border: 1px solid #3a3a3c;
    box-shadow: inset 0 0 0 1px #555, inset 0 1px 0 #666, 0 0 0 1px #0a0a0a;
    position: absolute; top: 0; left: 0;
    display: flex; flex-direction: row; align-items: center;
    padding: 16px 40px 16px 50px;
  }
  /* power button on top */
  .ipad-h-frame::before {
    content: ''; position: absolute; top: -3px; right: 160px;
    width: 44px; height: 3px; background: #2c2c2e;
    border-radius: 2px 2px 0 0;
  }
  /* volume buttons on top */
  .ipad-h-frame::after {
    content: ''; position: absolute; top: -3px; left: 200px;
    width: 36px; height: 3px; background: #2c2c2e;
    border-radius: 2px 2px 0 0;
    box-shadow: 50px 0 0 #2c2c2e;
  }
  .ipad-h-camera {
    position: absolute; left: 23px; top: 50%; transform: translateY(-50%);
    width: 10px; height: 10px; background: #2a2a2c; border-radius: 50%;
    border: 1px solid #444; z-index: 10;
  }
  .ipad-h-screen {
    width: 1024px; height: 768px;
    background: #F6F3EC; border-radius: 8px; overflow: hidden;
    position: relative; flex-shrink: 0;
  }
  .ipad-h-home-indicator {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    width: 4px; height: 140px; background: rgba(255,255,255,0.25); border-radius: 2px;
  }

  /* ── SHARED SCREEN ELEMENTS ── */
  .device-iframe {
    width: 100%; height: 100%; border: none; display: block;
  }
  .loading-overlay {
    position: absolute; inset: 0;
    background: #F6F3EC;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 12px; z-index: 5;
    transition: opacity 0.3s;
  }
  .loading-overlay.hidden { opacity: 0; pointer-events: none; }
  .loading-spinner {
    width: 28px; height: 28px;
    border: 3px solid #D50032; border-top-color: transparent;
    border-radius: 50%; animation: spin 0.7s linear infinite;
  }
  .loading-label { font-size: 12px; color: #484F58; font-family: 'Helvetica Neue', Arial, sans-serif; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── DEVICE LABEL ── */
  .device-label-block {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  .device-label-name {
    font-size: 12px; font-weight: 600; color: var(--label); letter-spacing: 0.01em;
  }
  .device-label-dims {
    font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>

<div class="workspace">

  <!-- TOP BAR -->
  <header class="topbar">
    <div class="topbar-mark"></div>
    <span class="topbar-title">Read the Heat &amp; Take a Beat</span>
    <span class="topbar-sub">— Device Preview</span>
    <div class="topbar-spacer"></div>

    <!-- Device mode selector -->
    <div class="device-modes">
      <button class="mode-btn active" data-mode="phone" onclick="setMode(this)">
        <span class="mode-icon">📱</span> iPhone
      </button>
      <button class="mode-btn" data-mode="ipad-v" onclick="setMode(this)">
        <span class="mode-icon">⬜</span> iPad
      </button>
      <button class="mode-btn" data-mode="ipad-h" onclick="setMode(this)">
        <span class="mode-icon">▬</span> iPad Landscape
      </button>
      <button class="mode-btn" data-mode="compare" onclick="setMode(this)">
        <span class="mode-icon">⊞</span> Compare All
      </button>
    </div>

    <span class="topbar-badge">Live</span>
  </header>

  <!-- SIDEBAR -->
  <nav class="sidebar">

    <div class="sidebar-section-label">Launchers</div>

    <button class="nav-btn active" data-src="activity.html" onclick="loadPage(this)">
      <div class="nav-icon">🏃</div>
      <div class="nav-text">
        <span class="nav-name">Activity Level</span>
        <span class="nav-desc">Step 2 — Work intensity</span>
      </div>
    </button>

    <button class="nav-btn" data-src="index.html" onclick="loadPage(this)">
      <div class="nav-icon">🏠</div>
      <div class="nav-text">
        <span class="nav-name">Home / Sector Select</span>
        <span class="nav-desc">Step 1 — Industry sector</span>
      </div>
    </button>

    <div class="sidebar-section-label">Calculators</div>

    <button class="nav-btn" data-src="wbgt.html" onclick="loadPage(this)">
      <div class="nav-icon">🌡</div>
      <div class="nav-text">
        <span class="nav-name">WBGT</span>
        <span class="nav-desc">Wet-bulb globe temp</span>
      </div>
    </button>

    <button class="nav-btn" data-src="heat-index.html" onclick="loadPage(this)">
      <div class="nav-icon">🔆</div>
      <div class="nav-text">
        <span class="nav-name">Heat Index</span>
        <span class="nav-desc">NWS apparent temp</span>
      </div>
    </button>

    <button class="nav-btn" data-src="temp-humidity.html" onclick="loadPage(this)">
      <div class="nav-icon">💧</div>
      <div class="nav-text">
        <span class="nav-name">Temp + Humidity</span>
        <span class="nav-desc">Dry-bulb &amp; RH</span>
      </div>
    </button>

    <div class="sidebar-section-label">Reference</div>

    <button class="nav-btn" data-src="clothing.html" onclick="loadPage(this)">
      <div class="nav-icon">🦺</div>
      <div class="nav-text">
        <span class="nav-name">Clothing Factors</span>
        <span class="nav-desc">PPE correction guide</span>
      </div>
    </button>

    <button class="nav-btn" data-src="acclimatization.html" onclick="loadPage(this)">
      <div class="nav-icon">📅</div>
      <div class="nav-text">
        <span class="nav-name">Acclimatization</span>
        <span class="nav-desc">New-worker schedules</span>
      </div>
    </button>

    <button class="nav-btn" data-src="methodology.html" onclick="loadPage(this)">
      <div class="nav-icon">📚</div>
      <div class="nav-text">
        <span class="nav-name">Methodology</span>
        <span class="nav-desc">Sources &amp; approach</span>
      </div>
    </button>

    <div class="sidebar-divider"></div>

    <button class="reload-btn" onclick="reloadAll()">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
        <path d="M10.5 6a4.5 4.5 0 1 1-1.32-3.18M10.5 1.5V4.5H7.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Reset current page
    </button>

    <div class="sidebar-note">
      Loads live from the repo. Changes to any page file are reflected on reload.
    </div>

  </nav>

  <!-- STAGE -->
  <main class="stage" id="stage">

    <!-- ── PHONE ── -->
    <div class="device-wrap" id="wrap-phone">
      <div class="device-scale-clip" id="clip-phone">
        <div class="device-frame phone-frame" id="frame-phone">
          <div class="dynamic-island"></div>
          <div class="phone-screen">
            <div class="loading-overlay" id="loading-phone">
              <div class="loading-spinner"></div>
              <span class="loading-label">Loading…</span>
            </div>
            <iframe
              class="device-iframe"
              id="iframe-phone"
              src="./activity.html"
              title="iPhone preview"
              sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"
              onload="onLoad('phone')"
            ></iframe>
          </div>
          <div class="phone-home-indicator"></div>
        </div>
      </div>
      <div class="device-label-block">
        <span class="device-label-name">iPhone 14 Pro</span>
        <span class="device-label-dims">390 × 780 pt</span>
      </div>
    </div>

    <!-- ── IPAD PORTRAIT ── -->
    <div class="device-wrap" id="wrap-ipad-v" hidden>
      <div class="device-scale-clip" id="clip-ipad-v">
        <div class="device-frame ipad-v-frame" id="frame-ipad-v">
          <div class="ipad-v-camera"></div>
          <div class="ipad-v-screen">
            <div class="loading-overlay" id="loading-ipad-v">
              <div class="loading-spinner"></div>
              <span class="loading-label">Loading…</span>
            </div>
            <iframe
              class="device-iframe"
              id="iframe-ipad-v"
              src="./activity.html"
              title="iPad portrait preview"
              sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"
              onload="onLoad('ipad-v')"
            ></iframe>
          </div>
          <div class="ipad-home-indicator"></div>
        </div>
      </div>
      <div class="device-label-block">
        <span class="device-label-name">iPad Air · Portrait</span>
        <span class="device-label-dims">768 × 1024 pt</span>
      </div>
    </div>

    <!-- ── IPAD LANDSCAPE ── -->
    <div class="device-wrap" id="wrap-ipad-h" hidden>
      <div class="device-scale-clip" id="clip-ipad-h">
        <div class="device-frame ipad-h-frame" id="frame-ipad-h">
          <div class="ipad-h-camera"></div>
          <div class="ipad-h-screen">
            <div class="loading-overlay" id="loading-ipad-h">
              <div class="loading-spinner"></div>
              <span class="loading-label">Loading…</span>
            </div>
            <iframe
              class="device-iframe"
              id="iframe-ipad-h"
              src="./activity.html"
              title="iPad landscape preview"
              sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"
              onload="onLoad('ipad-h')"
            ></iframe>
          </div>
          <div class="ipad-h-home-indicator"></div>
        </div>
      </div>
      <div class="device-label-block">
        <span class="device-label-name">iPad Air · Landscape</span>
        <span class="device-label-dims">1024 × 768 pt</span>
      </div>
    </div>

  </main>
</div>

<script>
  // Natural (design) dimensions for each device frame (outer shell)
  const SIZES = {
    'phone':  { w: 426,  h: 860  },
    'ipad-v': { w: 800,  h: 1114 },
    'ipad-h': { w: 1114, h: 800  },
  };

  // Which devices each mode shows
  const MODES = {
    'phone':   ['phone'],
    'ipad-v':  ['ipad-v'],
    'ipad-h':  ['ipad-h'],
    'compare': ['phone', 'ipad-v', 'ipad-h'],
  };

  let currentMode = 'phone';
  let currentSrc  = './activity.html';

  // ── Scaling ────────────────────────────────────────────────────────────────

  function applyScale(id, scale) {
    const clip  = document.getElementById('clip-' + id);
    const frame = document.getElementById('frame-' + id);
    const nat   = SIZES[id];
    const w     = Math.round(nat.w * scale);
    const h     = Math.round(nat.h * scale);
    clip.style.width  = w + 'px';
    clip.style.height = h + 'px';
    frame.style.transform = `scale(${scale})`;
  }

  function recalcScales() {
    const stage   = document.getElementById('stage');
    const pad     = 64;                              // stage padding × 2
    const stageW  = stage.clientWidth  - pad;
    const stageH  = stage.clientHeight - pad;
    const devices = MODES[currentMode];
    const gaps    = Math.max(0, devices.length - 1) * 32; // gap between devices

    if (devices.length === 1) {
      const id    = devices[0];
      const nat   = SIZES[id];
      const scale = Math.min(stageW / nat.w, stageH / nat.h, 1.0);
      applyScale(id, scale);
    } else {
      // In compare mode each device gets equal width share
      const perW  = (stageW - gaps) / devices.length;
      devices.forEach(id => {
        const nat   = SIZES[id];
        const scale = Math.min(perW / nat.w, stageH / nat.h);
        applyScale(id, scale);
      });
    }
  }

  window.addEventListener('resize', recalcScales);

  // ── Mode switching ─────────────────────────────────────────────────────────

  function setMode(btn) {
    const mode = btn.dataset.mode;
    if (mode === currentMode) return;
    currentMode = mode;

    // update button states
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    // show/hide device wraps
    const active = MODES[mode];
    ['phone', 'ipad-v', 'ipad-h'].forEach(id => {
      const wrap = document.getElementById('wrap-' + id);
      wrap.hidden = !active.includes(id);
    });

    // kick off any iframes that were hidden and haven't loaded
    active.forEach(id => {
      const iframe = document.getElementById('iframe-' + id);
      if (!iframe.dataset.loaded) {
        showLoading(id);
        iframe.src = currentSrc;
      }
    });

    recalcScales();
  }

  // ── Page navigation ────────────────────────────────────────────────────────

  function loadPage(btn) {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentSrc = './' + btn.dataset.src;

    MODES[currentMode].forEach(id => {
      showLoading(id);
      document.getElementById('iframe-' + id).dataset.loaded = '';
      document.getElementById('iframe-' + id).src = currentSrc;
    });
  }

  function reloadAll() {
    const bust = '?r=' + Date.now();
    MODES[currentMode].forEach(id => {
      showLoading(id);
      document.getElementById('iframe-' + id).dataset.loaded = '';
      document.getElementById('iframe-' + id).src = currentSrc.split('?')[0] + bust;
    });
  }

  // ── Loading state ──────────────────────────────────────────────────────────

  function showLoading(id) {
    document.getElementById('loading-' + id).classList.remove('hidden');
  }

  function onLoad(id) {
    document.getElementById('iframe-' + id).dataset.loaded = '1';
    setTimeout(() => {
      document.getElementById('loading-' + id).classList.add('hidden');
    }, 250);
  }

  // ── Init ───────────────────────────────────────────────────────────────────

  // Initial scale after fonts settle
  window.addEventListener('load', recalcScales);
  setTimeout(recalcScales, 100);
</script>

</body>
</html>
