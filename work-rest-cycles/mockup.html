<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Read the Heat — Mobile Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0f1117;
    --surface:   #1a1f2e;
    --panel:     #222840;
    --border:    #2e3650;
    --accent:    #D50032;
    --navy:      #001E62;
    --text:      #e8eaf0;
    --muted:     #7a839e;
    --label:     #a0a8c0;
    --active-bg: #1e2a4a;
    --active-bd: #4a6fc0;
    --phone-w:   390;
    --phone-h:   780;
    --bezel-top: 48px;
    --bezel-bot: 32px;
    --bezel-side:18px;
    font-family: 'Inter', system-ui, sans-serif;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
  }

  /* ── OUTER LAYOUT ── */
  .workspace {
    display: grid;
    grid-template-columns: 220px 1fr;
    grid-template-rows: 48px 1fr;
    height: 100%;
  }

  /* ── TOP BAR ── */
  .topbar {
    grid-column: 1 / -1;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 20px;
  }
  .topbar-mark {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }
  .topbar-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: 0.01em;
  }
  .topbar-sub {
    font-size: 11px;
    color: var(--muted);
    margin-left: 2px;
  }
  .topbar-spacer { flex: 1; }
  .topbar-badge {
    font-size: 10px;
    font-weight: 600;
    color: var(--muted);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2px 7px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  /* ── SIDEBAR ── */
  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    padding: 12px 0 20px;
  }
  .sidebar-section-label {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 12px 16px 6px;
  }
  .sidebar-section-label:first-child { padding-top: 4px; }
  .nav-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 9px 16px;
    background: none;
    border: none;
    border-left: 2px solid transparent;
    cursor: pointer;
    text-align: left;
    color: var(--label);
    font-size: 12.5px;
    font-family: inherit;
    font-weight: 500;
    transition: background 0.12s, color 0.12s, border-color 0.12s;
    line-height: 1.3;
  }
  .nav-btn:hover { background: var(--panel); color: var(--text); }
  .nav-btn.active {
    background: var(--active-bg);
    border-left-color: var(--active-bd);
    color: #fff;
  }
  .nav-icon {
    width: 28px; height: 28px;
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
    background: var(--panel);
  }
  .nav-btn.active .nav-icon { background: rgba(74,111,192,0.25); }
  .nav-text { flex: 1; min-width: 0; }
  .nav-name { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nav-desc {
    display: block;
    font-size: 10px;
    color: var(--muted);
    font-weight: 400;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 1px;
  }
  .nav-btn.active .nav-desc { color: #a0b8e0; }

  .sidebar-divider {
    height: 1px;
    background: var(--border);
    margin: 8px 16px;
  }
  .reload-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 8px 12px 0;
    padding: 7px 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--muted);
    font-size: 11.5px;
    font-family: inherit;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.12s, color 0.12s;
  }
  .reload-btn:hover { background: var(--active-bg); color: var(--text); }
  .reload-btn svg { flex-shrink: 0; }

  .sidebar-note {
    margin: 12px 14px 0;
    padding: 8px 10px;
    background: rgba(213,0,50,0.08);
    border: 1px solid rgba(213,0,50,0.2);
    border-radius: 6px;
    font-size: 10.5px;
    color: #f08090;
    line-height: 1.5;
  }

  /* ── STAGE ── */
  .stage {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    overflow: hidden;
    position: relative;
  }

  /* subtle grid pattern */
  .stage::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 24px 24px;
    pointer-events: none;
  }

  /* ── PHONE FRAME ── */
  .phone-wrap {
    position: relative;
    z-index: 1;
    filter: drop-shadow(0 32px 80px rgba(0,0,0,0.7));
  }
  .phone-outer {
    width: calc(var(--phone-w) * 1px + var(--bezel-side) * 2);
    background: #1c1c1e;
    border-radius: 52px;
    padding: var(--bezel-top) var(--bezel-side) var(--bezel-bot);
    position: relative;
    border: 1px solid #3a3a3c;
    box-shadow:
      inset 0 0 0 1px #555,
      inset 0 1px 0 #666,
      0 0 0 1px #0a0a0a;
  }

  /* side buttons */
  .phone-outer::before {
    content: '';
    position: absolute;
    left: -3px;
    top: 100px;
    width: 3px;
    height: 36px;
    background: #2c2c2e;
    border-radius: 2px 0 0 2px;
    box-shadow: 0 44px 0 #2c2c2e, 0 88px 0 #2c2c2e;
  }
  .phone-outer::after {
    content: '';
    position: absolute;
    right: -3px;
    top: 140px;
    width: 3px;
    height: 64px;
    background: #2c2c2e;
    border-radius: 0 2px 2px 0;
  }

  /* dynamic island */
  .dynamic-island {
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 34px;
    background: #000;
    border-radius: 20px;
    z-index: 10;
  }

  /* home indicator */
  .home-indicator {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 5px;
    background: rgba(255,255,255,0.3);
    border-radius: 3px;
  }

  /* screen */
  .phone-screen {
    width: calc(var(--phone-w) * 1px);
    height: calc(var(--phone-h) * 1px);
    background: #F6F3EC;
    border-radius: 36px;
    overflow: hidden;
    position: relative;
  }

  /* iframe fills screen */
  .phone-screen iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
    border-radius: inherit;
  }

  /* loading overlay */
  .loading-overlay {
    position: absolute;
    inset: 0;
    background: #F6F3EC;
    border-radius: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    z-index: 5;
    transition: opacity 0.3s;
  }
  .loading-overlay.hidden { opacity: 0; pointer-events: none; }
  .loading-spinner {
    width: 28px; height: 28px;
    border: 3px solid #D50032;
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  .loading-label {
    font-size: 12px;
    color: #484F58;
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* scale down phone if viewport is short */
  @media (max-height: 900px) {
    :root {
      --phone-h: 680;
      --bezel-top: 44px;
      --bezel-bot: 28px;
    }
    .phone-outer { border-radius: 44px; }
    .phone-screen { border-radius: 28px; }
  }
  @media (max-height: 780px) {
    :root {
      --phone-h: 580;
      --bezel-top: 40px;
      --bezel-bot: 24px;
    }
    .phone-outer { border-radius: 38px; }
    .phone-screen { border-radius: 24px; }
  }
</style>
</head>
<body>

<div class="workspace">

  <!-- TOP BAR -->
  <header class="topbar">
    <div class="topbar-mark"></div>
    <span class="topbar-title">Read the Heat &amp; Take a Beat</span>
    <span class="topbar-sub">— Mobile Mockup</span>
    <div class="topbar-spacer"></div>
    <span class="topbar-badge">Live</span>
  </header>

  <!-- SIDEBAR -->
  <nav class="sidebar">

    <div class="sidebar-section-label">Launchers</div>

    <button class="nav-btn active" data-src="activity.html" onclick="loadPage(this)">
      <div class="nav-icon">🏃</div>
      <div class="nav-text">
        <span class="nav-name">Activity Level</span>
        <span class="nav-desc">Step 2 — Work intensity</span>
      </div>
    </button>

    <button class="nav-btn" data-src="index.html" onclick="loadPage(this)">
      <div class="nav-icon">🏠</div>
      <div class="nav-text">
        <span class="nav-name">Home / Sector Select</span>
        <span class="nav-desc">Step 1 — Industry sector</span>
      </div>
    </button>

    <div class="sidebar-section-label">Calculators</div>

    <button class="nav-btn" data-src="wbgt.html" onclick="loadPage(this)">
      <div class="nav-icon">🌡</div>
      <div class="nav-text">
        <span class="nav-name">WBGT</span>
        <span class="nav-desc">Wet-bulb globe temp</span>
      </div>
    </button>

    <button class="nav-btn" data-src="heat-index.html" onclick="loadPage(this)">
      <div class="nav-icon">🔆</div>
      <div class="nav-text">
        <span class="nav-name">Heat Index</span>
        <span class="nav-desc">NWS apparent temp</span>
      </div>
    </button>

    <button class="nav-btn" data-src="temp-humidity.html" onclick="loadPage(this)">
      <div class="nav-icon">💧</div>
      <div class="nav-text">
        <span class="nav-name">Temp + Humidity</span>
        <span class="nav-desc">Dry-bulb &amp; RH</span>
      </div>
    </button>

    <div class="sidebar-section-label">Reference</div>

    <button class="nav-btn" data-src="clothing.html" onclick="loadPage(this)">
      <div class="nav-icon">🦺</div>
      <div class="nav-text">
        <span class="nav-name">Clothing Factors</span>
        <span class="nav-desc">PPE correction guide</span>
      </div>
    </button>

    <button class="nav-btn" data-src="acclimatization.html" onclick="loadPage(this)">
      <div class="nav-icon">📅</div>
      <div class="nav-text">
        <span class="nav-name">Acclimatization</span>
        <span class="nav-desc">New-worker schedules</span>
      </div>
    </button>

    <button class="nav-btn" data-src="methodology.html" onclick="loadPage(this)">
      <div class="nav-icon">📚</div>
      <div class="nav-text">
        <span class="nav-name">Methodology</span>
        <span class="nav-desc">Sources &amp; approach</span>
      </div>
    </button>

    <div class="sidebar-divider"></div>

    <button class="reload-btn" onclick="reloadFrame()">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
        <path d="M10.5 6a4.5 4.5 0 1 1-1.32-3.18M10.5 1.5V4.5H7.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Reset current page
    </button>

    <div class="sidebar-note">
      Loads live from the repo. Changes to any page file are reflected on reload.
    </div>

  </nav>

  <!-- STAGE -->
  <main class="stage">
    <div class="phone-wrap">
      <div class="phone-outer">
        <div class="dynamic-island"></div>
        <div class="phone-screen">
          <div class="loading-overlay" id="loading">
            <div class="loading-spinner"></div>
            <span class="loading-label">Loading…</span>
          </div>
          <iframe
            id="app-frame"
            src="./activity.html"
            title="App preview"
            sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"
            onload="onFrameLoad()"
          ></iframe>
        </div>
        <div class="home-indicator"></div>
      </div>
    </div>
  </main>

</div>

<script>
  const frame = document.getElementById('app-frame');
  const loading = document.getElementById('loading');

  function onFrameLoad() {
    // slight delay so the page's own JS can settle
    setTimeout(() => loading.classList.add('hidden'), 250);
  }

  function loadPage(btn) {
    // update active state
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    // show loading, swap src
    loading.classList.remove('hidden');
    frame.src = './' + btn.dataset.src;
  }

  function reloadFrame() {
    loading.classList.remove('hidden');
    // force reload even if src hasn't changed
    frame.src = frame.src.split('?')[0] + '?r=' + Date.now();
  }
</script>

</body>
</html>
