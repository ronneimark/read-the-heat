<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heat Index Work-Rest Cycles</title>
<link rel="stylesheet" href="shared.css">
<style>
body { overflow: auto; }
main { padding: 0; max-width: none; }
@media (min-width: 601px) {
  header { height: 76px; overflow: hidden; }
  .header-attribution { display: none; }
  .header-inner { padding: 0; gap: 0; justify-content: center; align-items: center; height: 100%; overflow: hidden; }
  .header-brand { max-height: none; height: 76px; width: auto; max-width: none; object-fit: contain; margin-bottom: 0; transform: scale(1.55); transform-origin: center center; }
}

/* ── Navy divider below tab bars ── */
#hi-acclim-tab-bar-wrap,
#hi-unacclim-tab-bar-wrap {
  border-bottom: 4px solid var(--navy, #1A2A3A);
}

/* ── Tab bar ── */
.acclim-tab-bar {
  display: flex;
  justify-content: center;
  gap: 6px;
  background: #D6DFE9;
  padding: 8px 8px 0;
  flex-shrink: 0;
}
.acclim-tab-btn {
  padding: 14px 28px 12px;
  min-width: 160px;
  font-size: 15px;
  font-weight: 700;
  border: none;
  border-radius: 8px 8px 0 0;
  background: rgba(255,255,255,0.45);
  color: #4A5A6A;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  letter-spacing: 0.01em;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  font-family: inherit;
}
.acclim-tab-btn-title { font-size: 15px; font-weight: 800; line-height: 1.2; }
.acclim-tab-btn-sub   { font-size: 11px; font-weight: 500; letter-spacing: 0.02em; }
.acclim-tab-btn.active { background: var(--navy, #1A2A3A); color: #fff; }
.acclim-tab-btn.active .acclim-tab-btn-sub { opacity: 0.75; }
.acclim-tab-btn:not(.active):hover { background: rgba(255,255,255,0.7); color: var(--navy, #1A2A3A); }
.acclim-tab-btn:focus-visible { outline: 3px solid #005FCC; outline-offset: 2px; z-index: 1; }

/* ── Result tab — 2-column viewport-fit layout ── */
#hi-tab-result-wrap,
#hi-utab-result-wrap {
  display: flex;
  align-items: stretch;
  justify-content: center;
  box-sizing: border-box;
  padding: 16px;
  min-height: 0;
}
#hi-tab-result,
#hi-utab-result {
  width: 100%;
  max-width: 1060px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 1fr 300px;
  grid-template-rows: 1fr;
  gap: 14px;
  min-height: 0;
}

/* Left column: colored result block */
.result-main {
  border-radius: 14px;
  padding: 28px 28px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 0;
  text-align: left;
  grid-column: 1;
  grid-row: 1;
  min-height: 0;
}
.result-main-inner {
  display: flex;
  align-items: center;
  gap: 28px;
}
.result-clock  { flex-shrink: 0; }
.result-text   { flex: 1; min-width: 0; }
.result-label  {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 6px;
}
.result-headline {
  font-size: clamp(22px, 3.5vw, 42px);
  font-weight: 900;
  line-height: 1.05;
  margin-bottom: 8px;
}
.result-subtext { font-size: 14px; line-height: 1.5; }
.result-source  { margin-top: 14px; font-size: 10px; font-style: italic; }
.result-main.result-danger { background: var(--stop-bg, #AE1515); color: var(--stop-text, #fff); }

/* Right column: sidebar */
.result-sidebar {
  grid-column: 2;
  grid-row: 1;
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-height: 0;
  overflow-y: auto;
}
.result-input-card {
  background: var(--surface, #F8FAFB);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 14px;
  text-align: left;
  flex-shrink: 0;
}
.result-input-label {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--subtext, #484F58);
  margin-bottom: 3px;
}
.result-input-value {
  font-size: 17px;
  font-weight: 800;
  color: var(--navy, #1A2A3A);
  line-height: 1.1;
}
.result-input-sub {
  font-size: 11px;
  color: var(--subtext, #484F58);
  margin-top: 2px;
  line-height: 1.3;
}

/* Radiant heat note */
.radiant-warn-strip {
  padding: 10px 12px;
  background: #FFF8E1;
  border-left: 4px solid #F59E0B;
  border-radius: 0 8px 8px 0;
  font-size: 11px;
  line-height: 1.5;
  color: #78350F;
  flex-shrink: 0;
}
.radiant-warn-strip strong { display: block; margin-bottom: 2px; }

/* Monitoring guidance in sidebar */
.result-monitoring {
  background: var(--surface, #F8FAFB);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 12px;
  line-height: 1.55;
  flex-shrink: 0;
}
.result-monitoring-label {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--navy, #1A2A3A);
  margin-bottom: 5px;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--border);
}

/* Responsive: stack to single column on narrow screens */
@media (max-width: 680px) {
  #hi-tab-result,
  #hi-utab-result {
    grid-template-columns: 1fr;
    grid-template-rows: auto auto;
    overflow-y: auto;
  }
  .result-main    { grid-column: 1; grid-row: 1; padding: 20px 16px; }
  .result-sidebar { grid-column: 1; grid-row: 2; overflow-y: visible; }
  .result-main-inner { flex-direction: column; text-align: center; gap: 16px; }
}

/* ── Chart tabs — fixed, full-screen, flex column ── */
#hi-tab-chart,
#hi-utab-chart {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  overflow: hidden;
  display: none;
  flex-direction: column;
}
body.hi-chart-active,
body.hi-unacclim-chart-active { overflow: hidden; }

/* Unit toggle strip inside chart pane */
.chart-unit-strip {
  background: var(--surface, #F0F4F8);
  border-bottom: 1px solid var(--border, #D0D8E0);
  padding: 5px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}
.chart-unit-strip .toggle-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--subtext, #484F58);
}

.acclim-chart-grid {
  flex: 1;
  display: grid;
  grid-template-columns: 22% repeat(4, 1fr);
  grid-template-rows: repeat(7, 1fr); /* 1 header + 6 data rows */
  min-height: 0;
}
.acc-cell {
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  padding: 4px 6px;
  line-height: 1.15;
  box-sizing: border-box;
}
.acc-cell:nth-child(5n) { border-right: none; }
.acc-cell.acc-last-row  { border-bottom: none; }

.acc-hdr {
  font-size: 14px;
  font-weight: 800;
  background: var(--surface, #F0F4F8);
  color: var(--navy, #1A2A3A);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  white-space: nowrap;
  overflow: hidden;
}
.acc-range-hdr { justify-content: flex-start; padding-left: 14px; }
.acc-range {
  font-size: 14px;
  font-weight: 600;
  color: var(--navy, #1A2A3A);
  justify-content: flex-start;
  padding-left: 12px;
  background: var(--surface, #F8FAFB);
  white-space: nowrap;
  overflow: hidden;
}

/* Value cells */
.acclim-chart-grid .c-safe,
.acclim-chart-grid .c-low,
.acclim-chart-grid .c-caution,
.acclim-chart-grid .c-warn,
.acclim-chart-grid .c-high,
.acclim-chart-grid .c-stop {
  font-size: clamp(13px, 2.5vh, 32px);
  font-weight: 900;
}

/* Column / row / cell highlights */
.acc-user-col.acc-hdr { background: var(--navy, #1A2A3A); color: #fff; }
.acc-range.acc-user-row { background: #E3EDF7; font-weight: 800; border-left: 4px solid var(--navy, #1A2A3A); }
.acc-user-cell {
  outline: 7px solid var(--navy, #1A2A3A);
  outline-offset: -7px;
  position: relative;
  z-index: 1;
  font-size: clamp(16px, 3.5vh, 44px) !important;
}

/* ── Notes tabs ── */
#hi-tab-notes,
#hi-utab-notes {
  padding: 24px 20px 40px;
  max-width: 900px;
  margin: 0 auto;
}
.hi-notes-section { margin-bottom: 24px; }
.hi-notes-section h3 {
  font-size: 13px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--navy, #1A2A3A);
  margin: 0 0 10px;
  padding-bottom: 6px;
  border-bottom: 2px solid var(--border, #D0D8E0);
}
.hi-notes-block {
  background: var(--surface, #F8FAFB);
  border: 1px solid var(--border, #D0D8E0);
  border-radius: 8px;
  padding: 10px 14px;
  margin-bottom: 8px;
}
.hi-notes-range { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; color: var(--navy, #1A2A3A); margin-bottom: 4px; }
.hi-notes-text  { font-size: 13px; line-height: 1.55; }
</style>
<script src="./lang-link.js"></script>
</head>
<body>

<div id="fixed-top">
  <div class="hazard-bar"></div>
  <header>
    <a class="home-btn" href="index.html" title="Home" aria-label="Home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2 2.5 11.1a.9.9 0 0 0 1.15 1.38L5 11.35V20a1 1 0 0 0 1 1h4.5v-6h3v6H18a1 1 0 0 0 1-1v-8.65l1.35 1.13a.9.9 0 0 0 1.15-1.38Z"/></svg></a>
    <div class="header-inner">
      <img class="header-brand" src="images/read-the-heat-logo-wide.png" alt="Read the Heat &amp; Take a Beat — for indoor occupations">
      <div class="header-attribution">
        <a class="wrc-sph-pill" href="https://glcohs.uic.edu" target="_blank" rel="noopener" aria-label="UIC Great Lakes Center for Occupational Health and Safety"><img src="images/uic-public-health-logo.png" alt="UIC Public Health"></a>
        <span class="header-attribution-text">An outreach project of the Great Lakes Center for Occupational Health and Safety</span>
      </div>
    </div>
  </header>
  <div class="wrc-banner-strip">
    <div class="wrc-banner-strip-inner">
      <div class="wrc-breadcrumbs" id="wrc-breadcrumbs"></div>
      <button class="strip-btn" onclick="openMethodologyModal()">📚 Methodology</button>
    </div>
  </div>

  <!-- Acclimatized tab bar -->
  <div id="hi-acclim-tab-bar-wrap" style="display:none">
    <div class="acclim-tab-bar" id="hi-acclim-tab-bar" role="tablist" aria-label="Heat Index acclimatized worker views">
      <button class="acclim-tab-btn active" id="hi-tab-btn-result" role="tab"
              aria-selected="true" aria-controls="hi-tab-result-wrap" tabindex="0"
              onclick="switchHITab('result')">
        <span class="acclim-tab-btn-title"><span aria-hidden="true">📋 </span>My Work-Rest Cycle</span>
        <span class="acclim-tab-btn-sub">Your personalized recommendation</span>
      </button>
      <button class="acclim-tab-btn" id="hi-tab-btn-chart" role="tab"
              aria-selected="false" aria-controls="hi-tab-chart" tabindex="-1"
              onclick="switchHITab('chart')">
        <span class="acclim-tab-btn-title"><span aria-hidden="true">📊 </span>Full Chart</span>
        <span class="acclim-tab-btn-sub">All conditions &amp; activity levels</span>
      </button>
      <button class="acclim-tab-btn" id="hi-tab-btn-notes" role="tab"
              aria-selected="false" aria-controls="hi-tab-notes" tabindex="-1"
              onclick="switchHITab('notes')">
        <span class="acclim-tab-btn-title"><span aria-hidden="true">📝 </span>Notes</span>
        <span class="acclim-tab-btn-sub">Hydration &amp; limitations</span>
      </button>
    </div>
  </div>

  <!-- Unacclimatized tab bar -->
  <div id="hi-unacclim-tab-bar-wrap" style="display:none">
    <div class="acclim-tab-bar" id="hi-unacclim-tab-bar" role="tablist" aria-label="Heat Index unacclimatized worker views">
      <button class="acclim-tab-btn active" id="hi-utab-btn-result" role="tab"
              aria-selected="true" aria-controls="hi-utab-result-wrap" tabindex="0"
              onclick="switchHIUnacclimTab('result')">
        <span class="acclim-tab-btn-title"><span aria-hidden="true">📋 </span>My Work-Rest Cycle</span>
        <span class="acclim-tab-btn-sub">Your personalized recommendation</span>
      </button>
      <button class="acclim-tab-btn" id="hi-utab-btn-chart" role="tab"
              aria-selected="false" aria-controls="hi-utab-chart" tabindex="-1"
              onclick="switchHIUnacclimTab('chart')">
        <span class="acclim-tab-btn-title"><span aria-hidden="true">📊 </span>Full Chart</span>
        <span class="acclim-tab-btn-sub">All conditions &amp; activity levels</span>
      </button>
      <button class="acclim-tab-btn" id="hi-utab-btn-notes" role="tab"
              aria-selected="false" aria-controls="hi-utab-notes" tabindex="-1"
              onclick="switchHIUnacclimTab('notes')">
        <span class="acclim-tab-btn-title"><span aria-hidden="true">📝 </span>Notes</span>
        <span class="acclim-tab-btn-sub">Guidance &amp; limitations</span>
      </button>
    </div>
  </div>
</div><!-- /fixed-top -->

<main>

  <!-- ── Acclimatized tab panels ── -->
  <div id="hi-acclim-tabs" style="display:none">
    <div id="hi-tab-result-wrap" role="tabpanel" aria-labelledby="hi-tab-btn-result" tabindex="0">
      <div id="hi-tab-result"></div>
    </div>
    <div id="hi-tab-chart" role="tabpanel" aria-labelledby="hi-tab-btn-chart" tabindex="0">
      <div class="chart-unit-strip">
        <span class="toggle-label">Temperature Units:</span>
        <div class="toggle" role="group" aria-label="Temperature unit">
          <button class="active" id="btn-hi-f" aria-pressed="true" onclick="setHiUnit('F')">°F</button>
          <button id="btn-hi-c" aria-pressed="false" onclick="setHiUnit('C')">°C</button>
        </div>
      </div>
    </div>
    <div id="hi-tab-notes" role="tabpanel" aria-labelledby="hi-tab-btn-notes" tabindex="0"></div>
  </div><!-- /hi-acclim-tabs -->

  <!-- ── Unacclimatized tab panels ── -->
  <div id="hi-unacclim-tabs" style="display:none">
    <div id="hi-utab-result-wrap" role="tabpanel" aria-labelledby="hi-utab-btn-result" tabindex="0">
      <div id="hi-utab-result"></div>
    </div>
    <div id="hi-utab-chart" role="tabpanel" aria-labelledby="hi-utab-btn-chart" tabindex="0">
      <div class="chart-unit-strip">
        <span class="toggle-label">Temperature Units:</span>
        <div class="toggle" role="group" aria-label="Temperature unit">
          <button class="active" id="btn-hi-f2" aria-pressed="true" onclick="setHiUnit('F')">°F</button>
          <button id="btn-hi-c2" aria-pressed="false" onclick="setHiUnit('C')">°C</button>
        </div>
      </div>
    </div>
    <div id="hi-utab-notes" role="tabpanel" aria-labelledby="hi-utab-btn-notes" tabindex="0"></div>
  </div><!-- /hi-unacclim-tabs -->

</main>

<script src="shared.js?v=2"></script>
<script src="./lang-switch.js"></script>
<script>
  // ── Module state ──────────────────────────────────────────────────────────────
  let workerStatus          = 'acclimatized';
  let _hiCurrentTab         = 'result';
  let _hiUnacclimCurrentTab = 'result';
  let _hiUnit               = 'F';
  let _hiRowIdx             = -1;
  let _hiColIdx             = 1;
  let _hiUnacclimRowIdx     = -1;
  let _hiUnacclimColIdx     = 1;
  let _hiStoredVal          = null;
  let _hiStoredUnit         = 'F';
  let _hiActivity           = 'moderate';

  // ── Acclimatized HI data ──────────────────────────────────────────────────────
  const HI_BOUNDS_F = [80, 91, 103, 115, 130];
  const HI_DATA = [
    [ {w:null,r:null}, {w:null,r:null}, {w:null,r:null}, {w:null,r:null} ],
    [ {w:null,r:null}, {w:null,r:null}, {w:null,r:null,star:true}, {w:45,r:15} ],
    [ {w:null,r:null,star:true}, {w:45,r:15}, {w:30,r:30}, {w:15,r:45} ],
    [ {w:45,r:15}, {w:30,r:30}, {w:15,r:45}, null ],
    [ {w:30,r:30}, {w:15,r:45}, null, null ],
    [ null, null, null, null ]
  ];
  const HI_ROW_LABELS_F = ['Below 80°F','80–90°F','91–103°F','103–115°F','115–130°F','Above 130°F'];
  const HI_ROW_LABELS_C = ['Below 27°C','27–32°C','33–39°C','39–46°C','46–54°C','Above 54°C'];

  // ── Unacclimatized HI data ────────────────────────────────────────────────────
  const HI_UNACCLIM_BOUNDS_F = [72, 83, 95, 107, 122];
  const HI_UNACCLIM_DATA = [
    [ {w:null,r:null}, {w:null,r:null}, {w:null,r:null}, {w:null,r:null} ],
    [ {w:null,r:null}, {w:null,r:null}, {w:null,r:null,star:true}, {w:45,r:15} ],
    [ {w:null,r:null,star:true}, {w:45,r:15}, {w:30,r:30}, {w:15,r:45} ],
    [ {w:45,r:15}, {w:30,r:30}, {w:15,r:45}, null ],
    [ {w:30,r:30}, {w:15,r:45}, null, null ],
    [ null, null, null, null ]
  ];
  const HI_UNACCLIM_ROW_LABELS_F = ['Below 72°F','72–82°F','83–95°F','95–107°F','107–122°F','Above 122°F'];
  const HI_UNACCLIM_ROW_LABELS_C = ['Below 22°C','22–28°C','28–35°C','35–42°C','42–50°C','Above 50°C'];

  // ── Monitoring notes ──────────────────────────────────────────────────────────
  const HI_RANGE_NOTES = [
    { range:'Below 80°F (Below 27°C)',  text:'Normal work practices; maintain standard hydration (8 oz water every 20 min). Train workers on heat illness signs.' },
    { range:'80–90°F (27–32°C)',         text:'Implement basic precautions. Buddy system. 1 cup (8 oz) water every 20 min. Schedule harder tasks in cooler parts of shift. *Monitor heavy workers closely.' },
    { range:'91–103°F (33–39°C)',        text:'OSHA: Implement controls. Buddy system required. Enforce rest breaks in cool/shaded area. Hydration: 1 cup every 15–20 min. Watch new workers and unacclimatized workers especially.' },
    { range:'103–115°F (39–46°C)',       text:'OSHA: Active monitoring; frequent vital sign checks. Cool-down periods in air-conditioned or ventilated rest areas. Hydration: 1 cup every 15 min. Consider limiting new workers to ≤20% of shift in heat.' },
    { range:'115–130°F (46–54°C)',       text:'OSHA: Hazardous conditions. Engineering controls must be implemented or work suspended. Personal cooling (wet towels, cooling vests). Emergency response plan activated. Medical monitoring on-site.' },
    { range:'Above 130°F (Above 54°C)', text:'Imminent danger. All work should cease until conditions are corrected. Evacuation if engineering controls cannot reduce heat to safe levels.' }
  ];
  const HI_UNACCLIM_RANGE_NOTES = [
    { range:'Below 72°F (Below 22°C)',  text:'Normal work practices. Standard hydration, buddy system, and training on heat illness recognition. Unacclimatized workers require heightened supervisor attention.' },
    { range:'72–82°F (22–28°C)',         text:'Implement precautions. Buddy system required. 1 cup (8 oz) water every 20 min. New workers: limit to lighter tasks initially. Monitor heavy workers closely.' },
    { range:'83–95°F (28–35°C)',         text:'Active monitoring required. Enforce rest breaks in cool area. Hydration: 1 cup every 15–20 min. First week in heat: limit to 20% of shift exposure, increasing 20% per day.' },
    { range:'95–107°F (35–42°C)',        text:'Hazardous for unacclimatized workers. Active monitoring; vital sign checks. Cool-down in air-conditioned rest areas. Consider removing unacclimatized workers from this environment.' },
    { range:'107–122°F (42–50°C)',       text:'Unacclimatized workers should not be in this environment. Engineering controls must be implemented. Medical monitoring on-site. Emergency response plan activated.' },
    { range:'Above 122°F (Above 50°C)', text:'Imminent danger for all workers. All work should cease until conditions are corrected.' }
  ];

  // ── Shared helpers ────────────────────────────────────────────────────────────
  const ACT_COL   = { light:0, moderate:1, heavy:2, vh:3 };
  const ACT_LABEL = { light:'Light', moderate:'Moderate', heavy:'Heavy', vh:'Very Heavy' };
  const ACT_FULL  = { light:'Light Work', moderate:'Moderate Work', heavy:'Heavy Work', vh:'Very Heavy Work' };
  const ACT_EMOJI = { light:'🟢', moderate:'🟡', heavy:'🟠', vh:'🔴' };

  function getHIRow(val, unit) {
    const f = unit === 'F' ? parseFloat(val) : parseFloat(val) * 9/5 + 32;
    for (let i = 0; i < HI_BOUNDS_F.length; i++) if (f < HI_BOUNDS_F[i]) return i;
    return 5;
  }
  function getHIUnacclimRow(val, unit) {
    const f = unit === 'F' ? parseFloat(val) : parseFloat(val) * 9/5 + 32;
    for (let i = 0; i < HI_UNACCLIM_BOUNDS_F.length; i++) if (f < HI_UNACCLIM_BOUNDS_F[i]) return i;
    return 5;
  }
  function hiClass(cell) {
    if (!cell)          return 'c-stop';
    if (cell.w === null) return 'c-safe';
    if (cell.w === 45)   return 'c-caution';
    if (cell.w === 30)   return 'c-warn';
    if (cell.w === 15)   return 'c-high';
    return 'c-safe';
  }
  function hiLabel(cell) {
    if (!cell)           return 'DANGER!';
    if (cell.w === null) return cell.star ? 'Continuous*' : 'Continuous';
    return cell.w + ' / ' + cell.r;
  }

  // ── Clock SVG ─────────────────────────────────────────────────────────────────
  function buildClockSvg(cell) {
    const sz = 148, cx = sz/2, cy = sz/2, r = 58, circ = 2 * Math.PI * r;
    if (!cell) {
      return `<svg viewBox="0 0 ${sz} ${sz}" width="${sz}" height="${sz}" aria-hidden="true">
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="#FFEBEE" stroke="#AE1515" stroke-width="10"/>
        <text x="${cx}" y="${cy-6}" text-anchor="middle" dominant-baseline="middle" font-size="36" fill="#AE1515">⚠</text>
        <text x="${cx}" y="${cy+22}" text-anchor="middle" font-size="13" font-weight="800" fill="#AE1515">DANGER</text>
      </svg>`;
    }
    if (cell.w === null) {
      return `<svg viewBox="0 0 ${sz} ${sz}" width="${sz}" height="${sz}" aria-hidden="true">
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#2E7D32" stroke-width="12"/>
        <text x="${cx}" y="${cy-8}" text-anchor="middle" dominant-baseline="middle" font-size="36" font-weight="900" fill="#1A5A1F">60</text>
        <text x="${cx}" y="${cy+18}" text-anchor="middle" font-size="13" font-weight="700" fill="#2E7D32">min / hr</text>
      </svg>`;
    }
    const strokeColors = {45:'#E65100', 30:'#B71C1C', 15:'#8B0000'};
    const bgColors     = {45:'#FFF3E0', 30:'#FFEBEE', 15:'#FFCDD2'};
    const sc = strokeColors[cell.w] || '#1565C0';
    const bc = bgColors[cell.w]     || '#E3F0FF';
    const workDash = (cell.w / 60) * circ;
    return `<svg viewBox="0 0 ${sz} ${sz}" width="${sz}" height="${sz}" aria-hidden="true">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="${bc}" stroke="#BDBDBD" stroke-width="12"/>
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${sc}" stroke-width="12"
              stroke-dasharray="${workDash} ${circ - workDash}"
              stroke-dashoffset="${circ * 0.25}" transform="rotate(0 ${cx} ${cy})"/>
      <text x="${cx}" y="${cy-10}" text-anchor="middle" font-size="26" font-weight="900" fill="${sc}">${cell.w}</text>
      <text x="${cx}" y="${cy+12}" text-anchor="middle" font-size="12" font-weight="700" fill="${sc}">min work</text>
      <text x="${cx}" y="${cy+27}" text-anchor="middle" font-size="11" fill="#555">${cell.r} min rest</text>
    </svg>`;
  }

  // ── Shared result tab builder ─────────────────────────────────────────────────
  function _buildResultTab(containerId, data, rowLabelsF, rowLabelsC, rangeNotes, getRowFn, workerLabel, workerSub, sourceNote) {
    const unit = _hiUnit;
    let val = _hiStoredVal;
    if (val != null && _hiStoredUnit !== unit) {
      val = unit === 'C'
        ? Math.round((_hiStoredVal - 32) * 5/9 * 10) / 10
        : Math.round((_hiStoredVal * 9/5 + 32) * 10) / 10;
    }
    const rowIdx   = val != null ? getRowFn(val, unit) : -1;
    const colIdx   = _hiActivity in ACT_COL ? ACT_COL[_hiActivity] : 1;
    const cell     = rowIdx >= 0 ? data[rowIdx][colIdx] : null;
    const cls      = rowIdx >= 0 ? hiClass(cell) : 'c-safe';
    const rowLabel = rowIdx >= 0 ? (unit === 'C' ? rowLabelsC[rowIdx] : rowLabelsF[rowIdx]) : '—';
    const unitLabel = unit === 'C' ? '°C' : '°F';

    const bgMap = { 'c-safe':'var(--safe-bg)', 'c-low':'var(--safe-bg)', 'c-caution':'var(--caution-bg)', 'c-warn':'var(--warn-bg)', 'c-high':'var(--high-bg)', 'c-stop':'var(--stop-bg)' };
    const fgMap = { 'c-safe':'var(--safe-text)', 'c-low':'var(--safe-text)', 'c-caution':'var(--caution-text)', 'c-warn':'var(--warn-text)', 'c-high':'var(--high-text)', 'c-stop':'var(--stop-text)' };

    let headline, subtext;
    if (rowIdx < 0) {
      headline = 'See chart for conditions';
      subtext  = 'No heat index reading was found in your session. View the Full Chart tab to look up your work-rest cycle, or return to the calculator to enter your heat index reading.';
    } else if (!cell) {
      headline = 'DANGER — Stop Work';
      subtext  = 'Conditions exceed safe limits for ' + ACT_FULL[_hiActivity] + '. Work-practice controls alone are insufficient. Engineering controls and physiological monitoring are required before workers may be exposed.';
    } else if (cell.w === null) {
      headline = 'Continuous Work';
      subtext  = 'No mandatory rest break is required at this heat index level for ' + ACT_FULL[_hiActivity] + '. Stay hydrated — drink approximately 1 cup (8 oz) of water every 20 minutes.';
    } else {
      headline = cell.w + ' min work<br>' + cell.r + ' min rest';
      subtext  = 'For every 60-minute period, take <strong>' + cell.r + ' minutes of rest</strong> in a cool, shaded area before returning to ' + ACT_FULL[_hiActivity].toLowerCase() + '. Provide water and a cool rest area.';
    }

    const valDisplay = val != null ? val + unitLabel : '—';
    const monitoringRange = rowIdx >= 0 && rangeNotes[rowIdx]
      ? (unit === 'C'
          ? (rangeNotes[rowIdx].range.match(/\(([^)]+)\)/) || [])[1] || rangeNotes[rowIdx].range
          : rangeNotes[rowIdx].range.replace(/\s*\([^)]*\)/g, ''))
      : '';
    const monitoringHtml = rowIdx >= 0 && rangeNotes[rowIdx]
      ? `<div class="result-monitoring">
           <div class="result-monitoring-label">Monitoring &amp; Guidance — ${monitoringRange}</div>
           ${rangeNotes[rowIdx].text}
         </div>`
      : '';

    document.getElementById(containerId).innerHTML = `
      <div class="result-main ${cls === 'c-stop' ? 'result-danger' : ''}"
           style="background:${bgMap[cls]||'var(--safe-bg)'}; color:${fgMap[cls]||'var(--safe-text)'}">
        <div class="result-main-inner">
          <div class="result-clock">${buildClockSvg(rowIdx >= 0 ? cell : {w:null,r:null})}</div>
          <div class="result-text">
            <div class="result-label">Recommended Work-Rest Cycle</div>
            <div class="result-headline">${headline}</div>
            <div class="result-subtext">${subtext}</div>
            <div class="result-source">${sourceNote}</div>
          </div>
        </div>
      </div>
      <div class="result-sidebar">
        <div class="result-input-card">
          <div class="result-input-label"><span aria-hidden="true">🌡️ </span>Heat Index</div>
          <div class="result-input-value">${valDisplay}</div>
          <div class="result-input-sub">Range: ${rowLabel}</div>
        </div>
        <div class="result-input-card">
          <div class="result-input-label"><span aria-hidden="true">${ACT_EMOJI[_hiActivity]||'⚡'} </span>Work Intensity</div>
          <div class="result-input-value">${ACT_LABEL[_hiActivity]||'Moderate'}</div>
          <div class="result-input-sub">${ACT_FULL[_hiActivity]}</div>
        </div>
        <div class="result-input-card">
          <div class="result-input-label"><span aria-hidden="true">✅ </span>Worker Status</div>
          <div class="result-input-value">${workerLabel}</div>
          <div class="result-input-sub">${workerSub}</div>
        </div>
        ${monitoringHtml}
        <div class="radiant-warn-strip" role="note">
          <strong><span aria-hidden="true">⚠ </span>Radiant heat limitation:</strong> Heat Index does not account for radiant heat from equipment, machinery, ovens, or solar load. In work areas with high levels of radiant heat, Heat Index may significantly underestimate heat stress. Use WBGT when radiant heat sources are present.
        </div>
      </div>`;
    return { rowIdx, colIdx };
  }

  // ── Build acclimatized result tab ─────────────────────────────────────────────
  function buildHIResultTab(s, overrideUnit) {
    const storedVal  = s.hiF || s.heatIndex || s.measValue || null;
    const storedUnit = s.hiUnit || s.measUnit || 'F';
    const activity   = s.activity || 'moderate';
    if (storedVal != null) { _hiStoredVal = storedVal; _hiStoredUnit = storedUnit; }
    if (activity)           { _hiActivity  = activity; }
    if (overrideUnit) _hiUnit = overrideUnit;

    const res = _buildResultTab('hi-tab-result', HI_DATA, HI_ROW_LABELS_F, HI_ROW_LABELS_C, HI_RANGE_NOTES, getHIRow,
      'Acclimatized', 'NIOSH REL applies',
      'OSHA/NIOSH heat illness prevention guidance synthesized with NIOSH-based work-rest principles (NIOSH 2016)');
    _hiRowIdx = res.rowIdx;
    _hiColIdx = res.colIdx;
  }

  // ── Build unacclimatized result tab ───────────────────────────────────────────
  function buildHIUnacclimResultTab(s) {
    if (s) {
      const storedVal  = s.hiF || s.heatIndex || s.measValue || null;
      const storedUnit = s.hiUnit || s.measUnit || 'F';
      const activity   = s.activity || 'moderate';
      if (storedVal != null) { _hiStoredVal = storedVal; _hiStoredUnit = storedUnit; }
      if (activity)           { _hiActivity  = activity; }
    }
    const res = _buildResultTab('hi-utab-result', HI_UNACCLIM_DATA, HI_UNACCLIM_ROW_LABELS_F, HI_UNACCLIM_ROW_LABELS_C,
      HI_UNACCLIM_RANGE_NOTES, getHIUnacclimRow,
      'Unacclimatized', 'NIOSH RAL applies',
      'NIOSH RAL — methodology-derived HI approximation (NIOSH 2016). NIOSH RAL is expressed in WBGT; see WBGT tab for equation-confirmed values.');
    _hiUnacclimRowIdx = res.rowIdx;
    _hiUnacclimColIdx = res.colIdx;
  }

  // ── Shared chart builder ──────────────────────────────────────────────────────
  function _buildChartTab(paneId, data, rowLabelsF, rowLabelsC, rowIdx, colIdx, gridLabel) {
    const pane = document.getElementById(paneId);
    if (!pane) return;
    const labels   = _hiUnit === 'C' ? rowLabelsC : rowLabelsF;
    const actNames = ['Light Work','Moderate Work','Heavy Work','Very Heavy Work'];
    // Find the chart-unit-strip that's already in the pane, replace only the grid
    const existingGrid = pane.querySelector('.acclim-chart-grid');
    if (existingGrid) existingGrid.remove();

    let html = `<div class="acclim-chart-grid" role="grid" aria-label="${gridLabel}">`;
    html += '<div role="row" style="display:contents">';
    html += `<div class="acc-cell acc-hdr acc-range-hdr" role="columnheader" scope="col">Heat Index</div>`;
    for (let ci = 0; ci < 4; ci++) {
      const isUser = ci === colIdx;
      html += `<div class="acc-cell acc-hdr${isUser ? ' acc-user-col' : ''}" role="columnheader" scope="col"${isUser ? ' aria-label="' + actNames[ci] + ' — your selected work intensity"' : ''}>${actNames[ci]}</div>`;
    }
    html += '</div>';
    for (let ri = 0; ri < 6; ri++) {
      const isUserRow = ri === rowIdx;
      const isLastRow = ri === 5;
      html += '<div role="row" style="display:contents">';
      html += `<div class="acc-cell acc-range${isUserRow ? ' acc-user-row' : ''}${isLastRow ? ' acc-last-row' : ''}" role="rowheader" scope="row"${isUserRow ? ' aria-label="' + labels[ri].replace(/"/g,'&quot;') + ' — your heat index range"' : ''}>${labels[ri]}</div>`;
      for (let ci = 0; ci < 4; ci++) {
        const cell       = data[ri][ci];
        const isUserCol  = ci === colIdx;
        const isUserCell = isUserRow && isUserCol && rowIdx >= 0;
        const cls = hiClass(cell);
        const lbl = hiLabel(cell);
        const ariaLbl = isUserCell ? `${lbl} — your recommended work-rest cycle` : lbl;
        html += `<div class="acc-cell ${cls}${isUserCol ? ' acc-user-col' : ''}${isUserRow ? ' acc-user-row' : ''}${isUserCell ? ' acc-user-cell' : ''}${isLastRow ? ' acc-last-row' : ''}" role="gridcell" aria-label="${ariaLbl}">${lbl}</div>`;
      }
      html += '</div>';
    }
    html += '</div>';
    pane.insertAdjacentHTML('beforeend', html);
  }

  function buildHIChartTab() {
    _buildChartTab('hi-tab-chart', HI_DATA, HI_ROW_LABELS_F, HI_ROW_LABELS_C, _hiRowIdx, _hiColIdx,
      'Work-rest cycles by heat index and work intensity — acclimatized workers');
  }
  function buildHIUnacclimChartTab() {
    _buildChartTab('hi-utab-chart', HI_UNACCLIM_DATA, HI_UNACCLIM_ROW_LABELS_F, HI_UNACCLIM_ROW_LABELS_C,
      _hiUnacclimRowIdx, _hiUnacclimColIdx,
      'Work-rest cycles by heat index and work intensity — unacclimatized workers');
  }

  // ── Notes tab builders ────────────────────────────────────────────────────────
  function _buildNotesContent(rangeNotes, extraTop) {
    const unit = _hiUnit;
    let html = extraTop || '';
    html += `<div class="hi-notes-section">
      <h3>Monitoring &amp; Guidance by Heat Index Range</h3>`;
    rangeNotes.forEach(n => {
      const rangeLabel = unit === 'C'
        ? ((n.range.match(/\(([^)]+)\)/) || [])[1] || n.range)
        : n.range.replace(/\s*\([^)]*\)/g, '');
      html += `<div class="hi-notes-block">
        <div class="hi-notes-range">${rangeLabel}</div>
        <div class="hi-notes-text">${n.text}</div>
      </div>`;
    });
    html += `</div>
    <div class="hi-notes-section">
      <h3>Hydration Guidance</h3>
      <div class="note-box" style="margin:0">Workers should drink approximately 1 cup (8 oz / 240 mL) of cool water every 15–20 minutes during heat-exposed work — not waiting until thirsty. Avoid caffeine and alcohol. Electrolyte replacement is important for prolonged exposures (&gt;2 hours) with heavy sweating.</div>
    </div>
    <div class="hi-notes-section">
      <h3>Radiant Heat Limitation</h3>
      <div class="note-box warn-note" style="margin:0"><strong>Heat Index does not account for radiant heat from equipment, machinery, ovens, furnaces, or other hot surfaces.</strong> Heat index was developed for shade conditions with 5 mph wind. In indoor environments with direct radiant heat sources, very high or low air movement, or PPE/impermeable clothing — heat index <em>significantly underestimates</em> actual heat stress. If your work area has high levels of radiant heat, the work-rest cycles on this page may not adequately protect workers. WBGT is the preferred occupational heat stress measure in these settings.</div>
    </div>`;
    return html;
  }

  function buildHINotesTab() {
    const pane = document.getElementById('hi-tab-notes');
    if (!pane) return;
    pane.innerHTML = _buildNotesContent(HI_RANGE_NOTES, null);
  }

  function buildHIUnacclimNotesTab() {
    const pane = document.getElementById('hi-utab-notes');
    if (!pane) return;
    const extra = `<div class="hi-notes-section">
      <h3>Acclimatization Notice</h3>
      <div class="note-box" style="margin:0; border-left-color:#AE1515; background:#FFF0F0; color:#6D0000;">
        <strong><span aria-hidden="true">⚠ </span>Important:</strong> The unacclimatized work-rest cycles shown here do not capture the full acclimatization process recommended by NIOSH and OSHA. For detailed guidance on acclimatization protocols, employers should follow the recommendations in the NIOSH Criteria Document.<br><br>
        <em>National Institute for Occupational Safety and Health. (2016). <em>NIOSH criteria for a recommended standard: Occupational exposure to heat and hot environments</em> (DHHS [NIOSH] Publication No. 2016-106).</em><br><br>
        <strong>Note:</strong> These values are methodology-derived HI approximations. NIOSH RAL is expressed in WBGT — see the WBGT tab for equation-confirmed values.
      </div>
    </div>`;
    pane.innerHTML = _buildNotesContent(HI_UNACCLIM_RANGE_NOTES, extra);
  }

  // ── Grid font fitting ─────────────────────────────────────────────────────────
  function fitGridHeaderSize(gridEl) {
    if (!gridEl) return;
    const cells = [...gridEl.querySelectorAll('.acc-hdr, .acc-range')];
    if (!cells.length) return;
    let lo = 70, hi = 420;
    while (lo < hi) {
      const mid = Math.floor((lo + hi + 1) / 2);
      const fs  = (mid / 10) + 'px';
      cells.forEach(c => c.style.fontSize = fs);
      if (cells.some(c => c.scrollWidth > c.clientWidth + 1)) hi = mid - 1;
      else lo = mid;
    }
    cells.forEach(c => c.style.fontSize = (lo / 10) + 'px');
  }

  function sizeHIChartPane() {
    const fixedTop = document.getElementById('fixed-top');
    const pane     = document.getElementById('hi-tab-chart');
    if (!pane) return;
    pane.style.top = fixedTop.offsetHeight + 'px';
    requestAnimationFrame(() => fitGridHeaderSize(pane.querySelector('.acclim-chart-grid')));
  }
  function sizeHIUnacclimChartPane() {
    const fixedTop = document.getElementById('fixed-top');
    const pane     = document.getElementById('hi-utab-chart');
    if (!pane) return;
    pane.style.top = fixedTop.offsetHeight + 'px';
    requestAnimationFrame(() => fitGridHeaderSize(pane.querySelector('.acclim-chart-grid')));
  }

  // ── Tab switching ─────────────────────────────────────────────────────────────
  function switchHITab(which) {
    _hiCurrentTab = which;
    const tabs = ['result','chart','notes'];
    tabs.forEach(t => {
      const panelId = t === 'result' ? 'hi-tab-result-wrap' : 'hi-tab-' + t;
      const panel = document.getElementById(panelId);
      if (panel) panel.style.display = (t === which) ? (t === 'result' ? 'flex' : (t === 'chart' ? 'flex' : 'block')) : 'none';
      const btn = document.getElementById('hi-tab-btn-' + t);
      if (btn) {
        btn.classList.toggle('active', t === which);
        btn.setAttribute('aria-selected', String(t === which));
        btn.tabIndex = (t === which) ? 0 : -1;
      }
    });
    document.body.classList.toggle('hi-chart-active', which === 'chart');
    if (which === 'chart') sizeHIChartPane();
  }

  function switchHIUnacclimTab(which) {
    _hiUnacclimCurrentTab = which;
    const tabs = ['result','chart','notes'];
    tabs.forEach(t => {
      const panelId = t === 'result' ? 'hi-utab-result-wrap' : 'hi-utab-' + t;
      const panel = document.getElementById(panelId);
      if (panel) panel.style.display = (t === which) ? (t === 'result' ? 'flex' : (t === 'chart' ? 'flex' : 'block')) : 'none';
      const btn = document.getElementById('hi-utab-btn-' + t);
      if (btn) {
        btn.classList.toggle('active', t === which);
        btn.setAttribute('aria-selected', String(t === which));
        btn.tabIndex = (t === which) ? 0 : -1;
      }
    });
    document.body.classList.toggle('hi-unacclim-chart-active', which === 'chart');
    if (which === 'chart') sizeHIUnacclimChartPane();
  }

  // ── Unit toggle ───────────────────────────────────────────────────────────────
  function setHiUnit(unit) {
    _hiUnit = unit;
    // Update all unit toggle buttons
    document.querySelectorAll('[id^="btn-hi-"]').forEach(el => {
      const isF    = !el.id.includes('-c');
      const isActive = (unit === 'F') === isF;
      el.classList.toggle('active', isActive);
      el.setAttribute('aria-pressed', String(isActive));
    });
    // Rebuild charts if visible
    if (_hiCurrentTab         === 'chart') buildHIChartTab();
    if (_hiUnacclimCurrentTab === 'chart') buildHIUnacclimChartTab();
    // Rebuild result tabs with new unit
    if (_hiStoredVal != null) {
      buildHIResultTab({ measValue: _hiStoredVal, measUnit: _hiStoredUnit, activity: _hiActivity }, unit);
      buildHIUnacclimResultTab(null);
    }
  }

  // ── Worker status ─────────────────────────────────────────────────────────────
  function setWorkerStatus(status) {
    workerStatus = status;
    WRC.set({ workerStatus: status });
    const isAcclim = status === 'acclimatized';
    document.getElementById('hi-acclim-tabs').style.display             = isAcclim ? '' : 'none';
    document.getElementById('hi-acclim-tab-bar-wrap').style.display     = isAcclim ? '' : 'none';
    document.getElementById('hi-unacclim-tabs').style.display           = isAcclim ? 'none' : '';
    document.getElementById('hi-unacclim-tab-bar-wrap').style.display   = isAcclim ? 'none' : '';
    if (!isAcclim) {
      document.body.classList.remove('hi-chart-active');
    } else {
      document.body.classList.remove('hi-unacclim-chart-active');
      if (_hiCurrentTab === 'chart') document.body.classList.add('hi-chart-active');
    }
  }

  // ── Layout ────────────────────────────────────────────────────────────────────
  function updateLayout() {
    const fixedTop = document.getElementById('fixed-top');
    const main = document.querySelector('main');
    if (main) main.style.paddingTop = fixedTop.offsetHeight + 'px';
    if (_hiCurrentTab         === 'chart' && workerStatus === 'acclimatized')   sizeHIChartPane();
    if (_hiUnacclimCurrentTab === 'chart' && workerStatus === 'unacclimatized') sizeHIUnacclimChartPane();
  }

  // ── Init ──────────────────────────────────────────────────────────────────────
  document.addEventListener('DOMContentLoaded', () => {
    const s = WRC.get();
    const status   = s.workerStatusTable || (s.workerStatus === 'acclimatized' ? 'acclimatized' : (s.workerStatus ? 'unacclimatized' : 'acclimatized'));
    const act      = s.activity || 'moderate';
    const actLabel = s.activityLabel || 'Moderate Work';
    const emojiMap = { light:'🟢', moderate:'🟡', heavy:'🔴', vh:'⛔' };
    const bbActivity = document.getElementById('back-bar-activity');
    if (bbActivity) bbActivity.textContent = (emojiMap[act] || '') + ' ' + actLabel;

    workerStatus = status;
    const isAcclim = status === 'acclimatized';
    document.getElementById('hi-acclim-tabs').style.display             = isAcclim ? '' : 'none';
    document.getElementById('hi-acclim-tab-bar-wrap').style.display     = isAcclim ? '' : 'none';
    document.getElementById('hi-unacclim-tabs').style.display           = isAcclim ? 'none' : '';
    document.getElementById('hi-unacclim-tab-bar-wrap').style.display   = isAcclim ? 'none' : '';

    // Sync unit before building tabs
    const sessionUnit = s.measUnit || 'F';
    if (sessionUnit !== 'F') {
      _hiUnit = sessionUnit;
      document.querySelectorAll('[id^="btn-hi-"]').forEach(el => {
        const isF    = !el.id.includes('-c');
        const isActive = (sessionUnit === 'F') === isF;
        el.classList.toggle('active', isActive);
        el.setAttribute('aria-pressed', String(isActive));
      });
    }

    // Build all tab content
    buildHIResultTab(s);
    buildHIChartTab();
    buildHINotesTab();
    buildHIUnacclimResultTab(s);
    buildHIUnacclimChartTab();
    buildHIUnacclimNotesTab();

    // Activate first tab in each section
    switchHITab('result');
    switchHIUnacclimTab('result');

    // Keyboard nav — acclimatized tablist
    document.getElementById('hi-acclim-tab-bar').addEventListener('keydown', e => {
      const tabs = ['result','chart','notes'];
      const cur  = tabs.findIndex(t => document.getElementById('hi-tab-btn-' + t).getAttribute('aria-selected') === 'true');
      let next = cur;
      if      (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); next = (cur + 1) % tabs.length; }
      else if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   { e.preventDefault(); next = (cur - 1 + tabs.length) % tabs.length; }
      else if (e.key === 'Home')                                 { e.preventDefault(); next = 0; }
      else if (e.key === 'End')                                  { e.preventDefault(); next = tabs.length - 1; }
      else return;
      switchHITab(tabs[next]);
      document.getElementById('hi-tab-btn-' + tabs[next]).focus();
    });

    // Keyboard nav — unacclimatized tablist
    document.getElementById('hi-unacclim-tab-bar').addEventListener('keydown', e => {
      const tabs = ['result','chart','notes'];
      const cur  = tabs.findIndex(t => document.getElementById('hi-utab-btn-' + t).getAttribute('aria-selected') === 'true');
      let next = cur;
      if      (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); next = (cur + 1) % tabs.length; }
      else if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   { e.preventDefault(); next = (cur - 1 + tabs.length) % tabs.length; }
      else if (e.key === 'Home')                                 { e.preventDefault(); next = 0; }
      else if (e.key === 'End')                                  { e.preventDefault(); next = tabs.length - 1; }
      else return;
      switchHIUnacclimTab(tabs[next]);
      document.getElementById('hi-utab-btn-' + tabs[next]).focus();
    });

    setTimeout(buildBreadcrumbs, 0);
    updateLayout();
    window.addEventListener('resize', updateLayout);
  });
</script>
</body>
</html>
